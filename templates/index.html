<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Challenge: The Hidden Vault</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #fff;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #00ffcc;
            font-size: 2.5rem;
            text-transform: uppercase;
            animation: pulse 1.5s infinite alternate;
        }
        p {
            font-size: 1.2rem;
            margin-top: 10px;
        }
        @keyframes pulse {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>CTF Challenge: The Hidden Vault</h1>
    <p>Can you find the hidden vault and retrieve the flag?</p>

    <div id="hiddenMessage" class="hidden">
        <p>You're on the right track... Keep looking!</p>
    </div>

    <script>
        document.addEventListener("keydown", (event) => {
            if (event.key === "v") {
                document.getElementById("hiddenMessage").classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
